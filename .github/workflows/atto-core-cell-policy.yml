# Exact local source integrity and compiler-negative (when implemented) only.
# No alternate-org mirroring or compiled guest certificate.
name: Atto core cell owner policy source gate (NON-GUEST)
on:
  pull_request:
    paths:
      - 'library/atto.core/cell.atto'
      - 'tests/**core*cell*'
      - '.github/workflows/atto-core-cell-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-cell-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact commit and core-cell source blob before local tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "ATTO_CORE_CELL_HEAD=$EXPECTED_HEAD"
          echo "ATTO_CORE_CELL_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "ATTO_CORE_CELL_BLOB=$(git rev-parse HEAD:library/atto.core/cell.atto)"
      - name: Run source integrity and admission regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tests/test_core_math_hash_cell_source.py
      - name: Do not classify source-only observations as compiler guest parity
        if: always()
        shell: bash
        run: |
          echo 'CORE_CELL_SOURCE_POLICY_ONLY; compiled Atto guest and typed borrow-MIR NOT_EXECUTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job does not export a private Git tree.' >> "$GITHUB_STEP_SUMMARY"
